name: Deploy Frontend (SPA)

# フロント(SPA)を master への push で自動デプロイする。
# 認証は OIDC（短命の一時クレデンシャル）。永続アクセスキーは使わない。
on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:        # Actions タブからの手動実行も可能

permissions:
  id-token: write           # OIDC トークン取得に必須
  contents: read

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: movie-prf-spa
  CLOUDFRONT_DISTRIBUTION_ID: E3DINXZ7N5QLUB

jobs:
  deploy-frontend:
    name: Build & Deploy SPA to S3/CloudFront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build (vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: S3 sync (--delete で旧ファイル削除)
        run: |
          aws s3 sync ./frontend/dist "s3://${{ env.S3_BUCKET }}/" \
            --delete --region "${{ env.AWS_REGION }}"

      - name: CloudFront invalidation (/*)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*'
