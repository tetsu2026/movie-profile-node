# NestJS版 動画付き自己紹介プラットフォーム
# 配置先: /etc/nginx/conf.d/nestjs.conf
#
# 使用方法:
#   sudo cp deploy/nginx/nestjs.conf /etc/nginx/conf.d/nestjs.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# ポート8080でlistenし、Laravel版(:80)と共存する
# セキュリティグループでポート8080を開放すること

server {
    listen 8080;
    server_name _;

    client_max_body_size 100M;

    # React SPA の配信
    location / {
        root /var/www/movie-prf-node/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # NestJS API へのプロキシ
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # 静的ファイルのキャッシュ設定
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/movie-prf-node/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
